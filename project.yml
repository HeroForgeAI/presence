name: Presence
options:
  bundleIdPrefix: com.makallen
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Presence:
    type: application
    platform: macOS
    sources:
      - path: Presence
        excludes:
          - Info.plist
      - path: AppIcon.icon
        type: folder
        buildPhase: resources
    dependencies:
      - target: PresenceCamera
        embed: true
    postCompileScripts:
      - name: Compile app icon
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          OUT="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "${OUT}"
          xcrun actool "${SRCROOT}/AppIcon.icon" \
            --compile "${OUT}" \
            --output-format human-readable-text \
            --warnings --errors \
            --app-icon AppIcon \
            --include-all-app-icons \
            --enable-on-demand-resources NO \
            --target-device mac \
            --minimum-deployment-target 26.0 \
            --platform macosx \
            --output-partial-info-plist "${TEMP_DIR}/PresenceIcon.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.makallen.presence
        PRODUCT_NAME: Presence
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Presence/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Presence
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSCameraUsageDescription: Presence uses your camera to show you in the meeting, including a short loop while you step away.
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  PresenceCamera:
    type: system-extension
    platform: macOS
    sources:
      - PresenceCamera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.makallen.presence.camera
        PRODUCT_NAME: PresenceCamera
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: PresenceCamera/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Presence Camera
        CODE_SIGN_ENTITLEMENTS: PresenceCamera/PresenceCamera.entitlements
        SKIP_INSTALL: YES
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  PresenceTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - path: Presence/LoopMath.swift
      - path: Presence/CameraPolicy.swift
      - path: Presence/KeyChord.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.makallen.presence.tests
        CODE_SIGNING_REQUIRED: "NO"
schemes:
  Presence:
    build:
      targets:
        Presence: all
        PresenceCamera: all
        PresenceTests: [test]
    run:
      config: Debug
    test:
      targets:
        - PresenceTests
