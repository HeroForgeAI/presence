      <rect width="108" height="150" rx="16" fill="#ffffff"/>
      <ellipse cx="54" cy="108" rx="32" ry="16" fill="#c9bfb4"/>
      <rect x="48" y="84" width="12" height="18" rx="5" fill="#c9bfb4"/>
      <circle cx="54" cy="74" r="15" fill="#c9bfb4"/>
    </g>
    <g transform="translate(304,82)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -10; 0 0" dur="3.6s" begin="0.5s" repeatCount="indefinite" additive="sum"/>
      <rect width="108" height="150" rx="16" fill="#ffffff"/>
      <ellipse cx="54" cy="108" rx="32" ry="16" fill="#c9bfb4"/>
      <rect x="48" y="84" width="12" height="18" rx="5" fill="#c9bfb4"/>
      <circle cx="54" cy="74" r="15" fill="#c9bfb4"/>
    </g>
    <g transform="translate(428,88)">
